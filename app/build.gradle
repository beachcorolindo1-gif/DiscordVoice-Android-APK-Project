plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lanbuddy.voice'
    compileSdk 34

    defaultConfig {
        applicationId "com.lanbuddy.voice"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero heavy dependencies: Pure Android SDK + WebView + AudioRecord
}
